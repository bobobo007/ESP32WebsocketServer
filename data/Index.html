<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Čistička</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f4f7f9;
      color: #333;
      text-align: center;
    }
    h2 {
      color: #0043af;
      margin-bottom: 20px;
    }
    .section {
      margin: 30px auto;
      max-width: 600px;
      background: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      border-radius: 10px;
      padding: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th {
      background-color: #0043af;
      color: white;
      padding: 10px;
      border-radius: 6px 6px 0 0;
    }
    td {
      padding: 10px;
      background-color: #eaf6f6;
      border-bottom: 1px solid #ddd;
    }
    .button {
      background-color: #50c878;
      border: none;
      color: white;
      padding: 10px 16px;
      margin: 5px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .button:hover {
      background-color: #3da263;
    }
    .red-led {
		width: 20px;
		height: 20px;
		background-color: #e74c3c;
		border-radius: 50%;
		display: inline-block;
		box-shadow: 0 0 5px rgba(0,0,0,0.2);
	}
	.green-led {
		width: 20px;
		height: 20px;
		background-color: #27ae60;
		border-radius: 50%;
		display: inline-block;
		box-shadow: 0 0 5px rgba(0,0,0,0.2);
	}
    @media (max-width: 600px) {
      .button { width: 100%; margin-top: 10px; }
    }
  </style>
</head>
<body>
  <h2>Čistička</h2>
  
  <div class="section">
    <h3>Hodnoty</h3>
    <table>
      <tr><td>Výška hladiny:</td><td><span id="depth">...</span> mm</td></tr>
      <tr><td>Teplota na ventile:</td><td><span id="temperature">...</span> °C</td></tr>
      <tr><td>Teplota na PCB:</td><td><span id="temperaturePCB">...</span> °C</td></tr>
      <tr><td>WiFi signál:</td><td><span id="wifiSignal">...</span> dB</td></tr>
      <tr><td>Hardware:</td><td><span id="hardware">...</span></td></tr>
      <tr><td>Software:</td><td><span id="software">...</span></td></tr>
    </table>
  </div>

  <div class="section">
    <h3>Ovládanie</h3>
    <button class="button" id="setTime">Nastav čas</button>
    <button class="button" id="clearLog">Vymaž log</button>
    <button class="button" id="drain">Odkaľ</button>
    <button class="button" id="clean">Čistenie</button>
  </div>

  <div class="section">
    <h3>Vstupy</h3>
    <table>
      <tr><td>Odkalovací ventyl:</td><td><div id="IN1" class="led red"></div></td></tr>
      <tr><td>Čistiaci ventyl:</td><td><div id="IN2" class="led red"></div></td></tr>
      <tr><td>Záchytná nádrž:</td><td><div id="IN3" class="led red"></div></td></tr>
      <tr><td>Čistička plná:</td><td><div id="IN4" class="led red"></div></td></tr>
    </table>
  </div>

  <div class="section">
    <h3>Výstupy</h3>
    <table>
      <tr><td>Odkalovací ventyl:</td><td><div id="OUT1" class="led red" onclick="toggleOutput(1)"></div></td></tr>
      <tr><td>Čistiaci ventyl:</td><td><div id="OUT2" class="led red" onclick="toggleOutput(2)"></div></td></tr>
      <tr><td>Nahrievanie:</td><td><div id="OUT3" class="led red" onclick="toggleOutput(3)"></div></td></tr>
      <tr><td>Nahrievanie PCB:</td><td><div id="OUT4" class="led red" onclick="toggleOutput(4)"></div></td></tr>
    </table>
  </div>
	<script>
        const ws = new WebSocket('ws://192.168.1.99/ws'); // Replace with your server address

        ws.onopen = () => {
            console.log('WebSocket connection established.');
            ws.send(JSON.stringify({ com: 'gv', sta: true })); // Request initial values
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);

            // Update values
            if (data.te !== undefined) document.getElementById('temperature').innerText = data.te;
            if (data.tp !== undefined) document.getElementById('temperaturePCB').innerText = data.tp;
            if (data.de !== undefined) document.getElementById('depth').innerText = data.de;
            if (data.wi !== undefined) document.getElementById('wifiSignal').innerText = data.wi;
            if (data.ha !== undefined) document.getElementById('hardware').innerText = data.ha;
            if (data.so !== undefined) document.getElementById('software').innerText = data.so;

            // Update "clean" button
            const cleanButton = document.getElementById('clean');
            if (data.cl !== undefined) {
                cleanButton.innerText = data.cl ? 'Čistenie' : 'Recirkulácia';
                cleanButton.style.backgroundColor = data.cl ? '#228B22' : '#50FF50';
                cleanButton.onclick = () => ws.send(JSON.stringify({ com: 'cl', sta: !data.cl }));
            }

            // Update "drain" button
            const drainButton = document.getElementById('drain');
            if (data.fl !== undefined) {
			drainButton.style.backgroundColor = data.fl ? '#FF5050' : '#50FF50';
			drainButton.disabled = data.fl;
            }

            // Update inputs (ip)
            if (data.ip !== undefined) {
                data.ip.forEach((state, index) => {
                    const inputElement = document.getElementById(`IN${index + 1}`);
                    inputElement.className = state ? 'green-led' : 'red-led';
                });
            }

            // Update outputs (ou)
            if (data.ou !== undefined) {
                data.ou.forEach((state, index) => {
                    const outputElement = document.getElementById(`OUT${index + 1}`);
                    outputElement.className = state ? 'green-led' : 'red-led';
                    outputElement.dataset.state = state; // Store the state in a data attribute
                });
            }
        };

        ws.onclose = () => {
            console.log('WebSocket connection closed.');
        };

        ws.onerror = (error) => {
            console.error('WebSocket error:', error);
        };

        // Button event listeners
        document.getElementById('setTime').addEventListener('click', () => {
            ws.send(JSON.stringify({ com: 'nt', sta: true }));
        });

        document.getElementById('clearLog').addEventListener('click', () => {
            ws.send(JSON.stringify({ com: 'dl', sta: true }));
        });

        document.getElementById('drain').addEventListener('click', () => {
            ws.send(JSON.stringify({ com: 'dr', sta: true }));
        });

        // Function to toggle outputs
        function toggleOutput(outputNumber) {
            const outputElement = document.getElementById(`OUT${outputNumber}`);
            const currentState = outputElement.dataset.state === 'true';
            ws.send(JSON.stringify({ com: `ou${outputNumber}`, sta: !currentState }));
        }
    </script>
</body>
</html>
